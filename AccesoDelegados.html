<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UNAC | Panel de Control Delegados</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- LIBRERÍAS FIREBASE COMPAT -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        :root { --accent: #ffc107; --dark: #050505; }
        body { background-color: var(--dark); font-family: 'Inter', sans-serif; color: white; margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        .glass { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(15px); border-radius: 20px; }
        input { width: 100%; background: rgba(0,0,0,0.5) !important; border: 1px solid rgba(255,193,7,0.3) !important; color: white !important; padding: 15px; border-radius: 10px; margin-bottom: 15px; outline: none; text-align: center; }
        input:focus { border-color: var(--accent) !important; }
        .btn-gold { background: var(--accent); color: black; width: 100%; padding: 15px; border-radius: 10px; font-weight: 900; text-transform: uppercase; transition: 0.3s; cursor: pointer; }
        .btn-gold:hover { transform: scale(1.02); background: white; }
        #reader { width: 100% !important; border: none !important; border-radius: 15px; overflow: hidden; }
        .hidden { display: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        #flash-notif { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 9999; background: #10b981; color: white; padding: 25px 50px; border-radius: 20px; font-weight: 900; text-align: center; box-shadow: 0 0 50px rgba(16, 185, 129, 0.6); display: none; border: 2px solid white; pointer-events: none; }
        .notif-error { background: #ef4444 !important; }
        .btn-horario { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: #555; padding: 15px 5px; border-radius: 12px; font-weight: 900; text-transform: uppercase; font-size: 10px; transition: 0.3s; cursor: pointer; }
        .active-6pm { background: #0284c7 !important; color: white !important; border-color: #38bdf8 !important; box-shadow: 0 0 15px rgba(2, 132, 199, 0.4); }
        .active-10pm { background: #7c3aed !important; color: white !important; border-color: #a78bfa !important; box-shadow: 0 0 15px rgba(124, 58, 237, 0.4); }
    </style>
</head>
<body>

    <div id="flash-notif">
        <i id="flash-icon" class="fa-solid fa-circle-check text-5xl mb-2"></i><br>
        <span id="flash-text" class="text-2xl uppercase italic tracking-tighter">Escaneo Verificado</span>
    </div>

    <header class="w-full max-w-lg p-6 flex justify-between items-center z-20">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 bg-yellow-500 rounded flex items-center justify-center shadow-lg"><i class="fa-solid fa-user-shield text-black text-lg"></i></div>
            <div class="flex flex-col text-left leading-none uppercase">
                <span class="text-[10px] font-black tracking-widest leading-none">UNAC</span>
                <span class="text-[9px] text-yellow-500 font-bold">Delegados</span>
            </div>
        </div>
        <button onclick="window.close()" class="text-[10px] font-black text-gray-500 uppercase tracking-widest hover:text-red-500 transition">Cerrar Panel <i class="fa-solid fa-xmark ml-1"></i></button>
    </header>

    <!-- LOGIN -->
    <div id="login-container" class="w-full max-w-sm px-6 mt-10 text-center animate-fade-in">
        <div class="mb-8">
            <h1 class="text-3xl font-black uppercase italic tracking-tighter">Acceso <span class="text-yellow-500">Restringido</span></h1>
            <p class="text-gray-500 text-[10px] tracking-widest uppercase mt-2">Credenciales de Delegado</p>
        </div>
        <div class="glass p-8">
            <input type="text" id="userDni" placeholder="DNI">
            <input type="password" id="userPass" placeholder="CONTRASEÑA">
            <button onclick="intentarLogin()" class="btn-gold shadow-lg">Entrar al Sistema</button>
            <p id="errorLogin" class="text-red-500 text-[10px] font-bold mt-4 hidden">ERROR DE ACCESO</p>
        </div>
    </div>

    <!-- SCANNER PANEL -->
    <div id="scanner-container" class="w-full max-w-lg px-4 py-4 hidden animate-fade-in">
        <div class="flex justify-between items-center mb-6 px-2">
            <div>
                <h2 class="text-xl font-black italic uppercase">Panel de <span class="text-yellow-500">Control</span></h2>
                <p id="delegadoNombre" class="text-gray-500 text-[9px] uppercase font-bold tracking-widest"></p>
            </div>
            <button onclick="location.reload()" class="bg-white/5 border border-white/10 text-[9px] px-3 py-1.5 rounded-lg font-black uppercase text-gray-400 hover:text-white transition">Regresar</button>
        </div>

        <div class="glass p-4 mb-6"><div id="reader"></div></div>

        <!-- CONTADORES TRI-COLUMNA -->
        <div class="grid grid-cols-3 gap-2 mb-4 text-center">
            <div class="glass p-3 border-b-2 border-yellow-500">
                <span class="text-[7px] text-gray-500 uppercase font-black block mb-1">Mis Escaneos</span>
                <span id="contador" class="text-2xl font-black text-yellow-500">0</span>
            </div>
            <div class="glass p-3 border-b-2 border-orange-500">
                <span class="text-[7px] text-gray-500 uppercase font-black block mb-1">Solicitados</span>
                <span id="contador-solicitados" class="text-2xl font-black text-orange-500">0</span>
            </div>
            <div class="glass p-3 border-b-2 border-blue-500 relative">
                <span class="text-[7px] text-gray-500 uppercase font-black block mb-1">Total Global</span>
                <span id="contador-global" class="text-2xl font-black text-blue-500">0</span>
            </div>
        </div>

        <div class="glass p-3 border-b-2 border-green-500 text-center mb-6">
            <span id="scan-status" class="text-[10px] font-black text-green-500 uppercase">Lector Activo</span>
        </div>

        <!-- REGISTRO LOCAL / LISTA REALTIME -->
        <div class="glass p-6 mb-6">
            <h3 class="text-[10px] font-black uppercase text-gray-400 mb-4 border-b border-white/10 pb-2 flex justify-between">
                <span>Registro Realtime (Hoy)</span>
                <span class="text-yellow-500">Sincronizado</span>
            </h3>
            <div id="listaEscaneo" class="space-y-3 max-h-64 overflow-y-auto pr-2">
                <!-- Se llena dinámicamente: Verde = Escaneado, Rojo = Solo ticket -->
            </div>
        </div>

        <!-- BOTONES DE TURNOS (TICKET MAÑANA ES AUTOMÁTICO, NO LLEVA BOTÓN) -->
        <div class="grid grid-cols-2 gap-3 mb-6">
            <button id="btn-6pm" onclick="toggleHorario('tarde')" class="btn-horario">Ticket 6:00 PM</button>
            <button id="btn-1015pm" onclick="toggleHorario('noche')" class="btn-horario">Ticket 10:15 PM</button>
        </div>

        <!-- BOTONES DE REINICIO ORIGINALES -->
        <div class="grid grid-cols-2 gap-3 mb-10">
            <button onclick="limpiarHistorial()" class="w-full bg-orange-600 text-white font-black py-4 rounded-xl uppercase text-[10px]">Borrar Local</button>
            <button id="btn-reiniciar" onclick="enviarYReiniciar()" class="w-full bg-red-600 text-white font-black py-4 rounded-xl uppercase text-[10px]">Reiniciar Sistema</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBxaeAc2nq7iEeiLejvja3lKGwR4E09QS4",
            authDomain: "ventanilla-unac.firebaseapp.com",
            databaseURL: "https://ventanilla-unac-default-rtdb.firebaseio.com",
            projectId: "ventanilla-unac",
            storageBucket: "ventanilla-unac.appspot.com",
            messagingSenderId: "245380540222",
            appId: "1:245380540222:web:d4ea08b7818bf89d682e6f"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const soundOk = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
        const soundError = new Audio('https://www.soundjay.com/buttons/beep-05.mp3');

        let delegadoActivo = "";
        const DELEGADOS = ["71886034", "77570731", "63229248", "73438294", "70694926"];

        db.ref('sistema/config').on('value', snap => {
            const cfg = snap.val() || {};
            document.getElementById('btn-6pm').className = cfg.tarde_activo ? 'btn-horario active-6pm' : 'btn-horario';
            document.getElementById('btn-1015pm').className = cfg.noche_activo ? 'btn-horario active-10pm' : 'btn-horario';
        });

        function toggleHorario(t) {
            const ref = db.ref(`sistema/config/${t}_activo`);
            ref.once('value', s => ref.set(!s.val()));
        }

        function intentarLogin() {
            const dni = document.getElementById('userDni').value;
            const pass = document.getElementById('userPass').value;
            if (DELEGADOS.includes(dni) && dni === pass) {
                delegadoActivo = dni;
                document.getElementById('login-container').classList.add('hidden');
                document.getElementById('scanner-container').classList.remove('hidden');
                document.getElementById('delegadoNombre').innerText = "ID: " + dni;
                iniciarSistema();
            } else {
                document.getElementById('errorLogin').classList.remove('hidden');
            }
        }

        function iniciarSistema() {
            const fecha = new Date().toISOString().split('T')[0];
            
            // LISTA DINÁMICA: Escucha tickets y asistencias
            db.ref('sistema').on('value', snap => {
                const data = snap.val() || {};
                const viajes = data.viajes ? data.viajes[fecha] : {};
                const asistencias = (data.asistencias && data.asistencias[fecha]) ? data.asistencias[fecha] : {};
                
                let tickets = {};
                if(viajes.mañana) Object.assign(tickets, viajes.mañana.registros);
                if(viajes.tarde) Object.assign(tickets, viajes.tarde.registros);
                if(viajes.noche) Object.assign(tickets, viajes.noche.registros);

                renderLista(tickets, asistencias);
                
                document.getElementById('contador-solicitados').innerText = Object.keys(tickets).length;
                document.getElementById('contador-global').innerText = Object.keys(asistencias).length;
                document.getElementById('contador').innerText = Object.values(asistencias).filter(a => a.delegado === delegadoActivo).length;
            });

            const scanner = new Html5QrcodeScanner("reader", { fps: 20, qrbox: 250 });
            scanner.render(onScanSuccess);
        }

        function renderLista(tickets, asistencias) {
            const listDiv = document.getElementById('listaEscaneo');
            const dnis = Object.keys(tickets);
            if(dnis.length === 0) { listDiv.innerHTML = "<p class='text-center text-gray-600 text-[10px]'>Sin registros hoy.</p>"; return; }

            listDiv.innerHTML = dnis.map(dni => {
                const escaneado = asistencias[dni] ? true : false;
                return `
                    <div class="p-3 rounded-lg border-l-4 ${escaneado ? 'bg-green-500/10 border-green-500' : 'bg-red-500/10 border-red-500'} flex justify-between items-center">
                        <span class="text-[10px] font-black uppercase">${tickets[dni].nombre}</span>
                        <span class="text-[8px] font-bold ${escaneado ? 'text-green-500' : 'text-red-500'}">${escaneado ? 'VERIFICADO' : 'PENDIENTE'}</span>
                    </div>
                `;
            }).reverse().join('');
        }

        async function onScanSuccess(text) {
            const parts = text.split('-'); // UNAC-SECURE-DNI-T-ORDEN
            if(parts.length < 4) return notificarFlash("QR INVÁLIDO", false);

            const dni = parts[2], turnoKey = parts[3].toLowerCase() === 't' ? 'tarde' : (parts[3].toLowerCase() === 'n' ? 'noche' : 'mañana');
            const fecha = new Date().toISOString().split('T')[0];

            db.ref(`sistema/viajes/${fecha}/${turnoKey}/registros/${dni}`).once('value', snap => {
                if(snap.exists()){
                    db.ref(`sistema/asistencias/${fecha}/${dni}`).set({
                        nombre: snap.val().nombre, hora: new Date().toLocaleTimeString(), delegado: delegadoActivo
                    });
                    notificarFlash("VERIFICADO ✅", true);
                    soundOk.play();
                } else {
                    notificarFlash("SIN TICKET VÁLIDO", false);
                    soundError.play();
                }
            });
        }

        function notificarFlash(text, exito) {
            const flash = document.getElementById('flash-notif');
            document.getElementById('flash-text').innerText = text;
            flash.className = exito ? "" : "notif-error";
            flash.style.display = 'block';
            setTimeout(() => flash.style.display = 'none', 1500);
        }

        async function enviarYReiniciar() {
            if (confirm("⚠️ ¿REINICIAR SISTEMA? Se borrará todo en Firebase.")) {
                const fecha = new Date().toISOString().split('T')[0];
                await Promise.all([
                    db.ref(`sistema/viajes/${fecha}`).remove(),
                    db.ref(`sistema/asistencias/${fecha}`).remove(),
                    db.ref('sistema/config').set({ tarde_activo: false, noche_activo: false })
                ]);
                alert("Sistema Limpio");
                location.reload();
            }
        }

        function limpiarHistorial() { if(confirm("¿Limpiar vista?")) location.reload(); }
    </script>
</body>
</html>
